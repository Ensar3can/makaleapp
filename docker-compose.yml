x-app-environment: &app-environment
  NODE_ENV: production
  APP_URL: ${APP_URL:-http://localhost:3000}
  DATABASE_URL: '${DATABASE_URL:-sqlserver://sa:AipDevPassw0rd@mssql:1433;database=aip;trustServerCertificate=true;encrypt=true}'
  TEST_DATABASE_URL: '${TEST_DATABASE_URL:-sqlserver://sa:AipDevPassw0rd@mssql:1433;database=aip_test;trustServerCertificate=true;encrypt=true}'
  SQLSERVER_INSTANCE: ${SQLSERVER_INSTANCE:-mssql}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  OBJECT_STORAGE_DRIVER: ${OBJECT_STORAGE_DRIVER:-s3}
  OBJECT_STORAGE_ROOT: ${OBJECT_STORAGE_ROOT:-.data/storage}
  OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
  OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-aipminio}
  OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-aipminio123456}
  OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-aip}
  OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
  OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
  AI_PROVIDER: ${AI_PROVIDER:-fake}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
  AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
  MAX_ARTICLE_SIZE: ${MAX_ARTICLE_SIZE:-10000000}
  MAX_ARTICLE_WORDS: ${MAX_ARTICLE_WORDS:-20000}
  MAX_AI_COST_PER_ANALYSIS: ${MAX_AI_COST_PER_ANALYSIS:-1}
  SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-aip_session}
  SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-604800}
  SESSION_PEPPER: ${SESSION_PEPPER:-docker-local-pepper-change-me}

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-AipDevPassw0rd}
      MSSQL_PID: Developer
    ports:
      - '14333:1433'
    volumes:
      - mssql-data:/var/opt/mssql
    healthcheck:
      test: ['CMD-SHELL', 'timeout 1 bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/1433"']
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data
      - ./docker/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-aipminio}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-aipminio123456}
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing local/aip
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-aipminio}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-aipminio123456}
    restart: 'no'

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: web
    environment:
      <<: *app-environment
    ports:
      - '3000:3000'
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: worker
    environment:
      <<: *app-environment
    depends_on:
      mssql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      web:
        condition: service_healthy

  proxy:
    profiles: ['proxy']
    image: caddy:2-alpine
    ports:
      - '8080:80'
      - '8443:443'
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on:
      web:
        condition: service_healthy

  mail:
    profiles: ['mail']
    image: axllent/mailpit:latest
    ports:
      - '8025:8025'
      - '1025:1025'

volumes:
  mssql-data:
  redis-data:
  minio-data:
  caddy-data:
